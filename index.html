const pend=new Map(); let working=false;
/* undo / redo: every change to the plans and stored food made by one tap is one step */
const HIST={pn:{undo:[],redo:[]},lh:{undo:[],redo:[]},shop:{undo:[],redo:[]},fpn:{undo:[],redo:[]},flh:{undo:[],redo:[]}},HCOLS=new Set(["pn","lh","food","stock","custom","items","notes","favs"]);let histGroup={},histOff=0,histLast=null,histForce=null;
const clone=v=>v===undefined?null:JSON.parse(JSON.stringify(v));
/* undo works per page: it reverses the last thing you did on the page you're looking at.
   Anything done on N & P (including kitchen ticks) is N & P's; the same for Lil H.
   On the Stock page, list changes are the Stock page's own; fridge and freezer changes on the Cooked tab
   are undone on the Cooked tab, separately for N & P's food and Lil H's. */
function histScope(col,before,after){if(histForce)return histForce;const pg=document.body.dataset.page;
  if(pg==="np")return "pn";if(pg==="lilh")return "lh";
  if(col==="pn"||col==="lh")return "f"+col;if(col==="food"){const l=after||before;return l&&l.who==="lh"?"flh":"fpn"}return "shop"}
function histRecord(col,id,before,after){if(histOff||!HCOLS.has(col))return;const sc=histScope(col,before,after),H=HIST[sc];
  if(!histGroup[sc]){histGroup[sc]=[];histGroup[sc].t=histGroup[sc].t0=Date.now();H.undo.push(histGroup[sc]);if(H.undo.length>50)H.undo.shift();H.redo.length=0;setTimeout(()=>{histGroup[sc]=null;histUi()},0)}
  histLast=sc;histGroup[sc].push({col,id,before,after})}
function histUi(){document.querySelectorAll("[data-hist]").forEach(b=>{const H=HIST[b.dataset.hscope||"pn"];b.disabled=!H||!H[b.dataset.hist].length})}
function histStep(dir,sc){sc=sc||"pn";const H=HIST[sc],g=H[dir].pop();if(!g){histUi();return}histGroup[sc]=null;histOff++;
  try{(dir==="undo"?[...g].reverse():g).forEach(c=>put(c.col,c.id,dir==="undo"?c.before:c.after))}finally{histOff--}
  g.t=Date.now();histLast=sc;H[dir==="undo"?"redo":"undo"].push(g);histUi();toast(dir==="undo"?"Undone":"Redone")}
/* knock-on tidying from something you just did (a meal that's no longer cooked takes its leftovers with it) joins that step, so undo brings it all back */
function histAppend(fn){const sc=histLast,H=sc&&HIST[sc],g=H&&H.undo[H.undo.length-1];if(!g||Date.now()-(g.t||0)>1500){fn();return}
  const pg=histGroup[sc],po=histOff,pf=histForce;histOff=0;histGroup[sc]=g;histForce=sc;try{fn()}finally{histGroup[sc]=pg;histOff=po;histForce=pf}}
/* automatic tidying isn't something to undo */
const quietly=fn=>{histOff++;try{fn()}finally{histOff--}};
let ME=null;try{ME=localStorage.getItem("nph-me")}catch(_){}
/* a batch moved a day later (sh- keys): SHV changes whenever one is written; SHNEED marks a page whose shifts need working out again after something you did */
let SHV=0,shMoving=0;const SHNEED={};
function put(col,id,data){
  if(readOnly){toast("This copy is view only, so changes can't be saved.");return}
  if(data&&typeof data==="object"&&!Array.isArray(data))data={...data,_by:ME||null,_at:Date.now()};
  histRecord(col,id,clone(S[col][id]),clone(data));
  if(data===null)delete S[col][id];else S[col][id]=data;
  if(id.startsWith("sh-"))SHV++;else if((col==="pn"||col==="lh")&&!shMoving&&/^(x-|fz-m|sp-)/.test(id))SHNEED[col]=histOff?(SHNEED[col]||"q"):"a";
  saveLocal();schedule();
  if(db){const p=col+"/"+id;pend.delete(p);pend.set(p,{col,id,data,tries:0});work()}
}
async function work(){
  if(working||!db)return;working=true;
  while(pend.size&&db){
    const [path,w]=pend.entries().next().value;pend.delete(path);
    try{const ref=db.collection(w.col).doc(w.id);if(w.data===null)await ref.delete();else await ref.set(w.data)}
    catch(e){
      const c=e&&e.code;
      if(c==="invalid_argument"||c==="not_granted"){readOnly=true;pend.clear();setSync();toast("Changes can't be saved from this account.");break}
      if((c==="unavailable"||c==="resource_exhausted")&&w.tries<4){w.tries++;if(!pend.has(path))pend.set(path,w);await sleep(800+Math.random()*900);continue}
      if(c==="revoked"){db=null;syncMode="local";setSync();break}
      if(c==="quota_exceeded"){toast("The shared list is full. Remove some custom items.");}
      console.warn("save failed",e);
    }
  }
  working=false;
}
let rafId=0;
function schedule(){if(dragging||editing){needRender=true;return}if(rafId)return;rafId=requestAnimationFrame(()=>{rafId=0;renderAll()})}
function setSync(){
  const [cls,txt,sh]=readOnly?["ro","View only","View only"]:syncMode==="live"?["live","Shared · live","Live"]:syncMode==="starting"?["","Connecting…","…"]:["local","Saved on this phone only","This phone"];
  document.querySelectorAll("[data-sync]").forEach(el=>{el.className="sync "+cls;el.innerHTML=`<i></i><span class="sl">${txt}</span><span class="ss">${sh}</span>`;el.title=syncMode==="local"?"Open the app from its claude.ai link to share changes with each other":""});
}
function connect(){
  const use=window.claude&&typeof window.claude.use==="function"?window.claude.use("db"):Promise.resolve(null);
  use.then(d=>{
    if(!d){syncMode="local";setSync();return}
    db=d;syncMode="live";setSync();
    COLS.forEach(col=>{
      d.collection(col).onSnapshot(snap=>{
        const m={};snap.docs.forEach(doc=>{if(doc.exists)m[doc.id]=doc.data()});
        pend.forEach(p=>{if(p.col===col){if(p.data===null)delete m[p.id];else m[p.id]=p.data}});
        S[col]=m;saveLocal();schedule();
      },err=>{console.warn(err);if(err&&err.code==="revoked"){db=null;syncMode="local";setSync()}});
    });
    work();
    const u=window.claude.use("user");
    if(u)u.then(us=>{if(!us||!us.can)return;Promise.resolve(us.can("data.write")).then(w=>{if(w===false){readOnly=true;setSync()}}).catch(()=>{})}).catch(()=>{});

function stackCard(s,x){const lot=s.lot,Pl=s.P,R0=Pl.R[lot.r],t=s.t,fr=x.w==="fridge",leftD=x.exp-t;

  const hiCls=!fr&&!isFrozen(x)?"frz":fr&&thawing?"thw":"",mi=meta.indexOf(" · ");
  const metaH=hiCls&&mi>0?`${esc(meta.slice(0,mi))} · <b class="mhi ${hiCls}">${esc(meta.slice(mi+3))}</b>`:esc(meta);
  const mine=s.fut.filter(u=>u.alloc.some(a=>a.i===x.i));

  const tiles=(fr?tile("snow","Freeze","var(--k-freezer)","data-ffrz",!canFreeze)+(spare>0&&!canFreeze?tile("plus","Add to meal","var(--warn)","data-fadd"):""):tile("fridge","To fridge","var(--k-fridge)","data-fthaw"))
    +tile("cal","Change date","var(--acc)","data-fdate")+tile("x","Discard","var(--bad)","data-fdisc");
  return `<div class="fcard ${state}${open?" open":""}" data-fcard="${key}" style="--c:var(--i-${Pl.icOf(lot.r)})" aria-expanded="${open}">
    <div class="fch"><span class="bub">${ic(Pl.icOf(lot.r))}</span><b>${esc(R0.n)}</b><span class="fp">${plural(x.now,"portion")}</span><button class="fdots" data-fdots="${key}" aria-expanded="${open}" aria-label="Buttons for ${esc(R0.n)}" title="Freeze, change date, discard">${ic("dots")}</button></div>

/* pinned header: shadow once it's stuck, and keep "scroll to a day" clear of it */
function updStick(){
  /* pinned layers stack: each one pins just below the ones above it; the lowest pinned one gets the shadow */

  if(pg)pg.querySelectorAll(".stick").forEach(s=>{s.style.top=`calc(env(safe-area-inset-top, 0px) + ${h}px)`;
    const stuck=window.scrollY>0&&s.getBoundingClientRect().top<=h+1;s.classList.remove("stuck");if(stuck)last=s;h+=s.offsetHeight});
  if(last)last.classList.add("stuck");
  document.documentElement.style.setProperty("--stickh",h+"px")}

try{const mo=new ResizeObserver(es=>es.forEach(en=>{const lg=en.target.closest(".legend");if(lg.dataset.full!=null)window.nphFit(lg);else setMarq(lg)}));document.querySelectorAll(".keyrow .lwin").forEach(w=>mo.observe(w))}catch(_){}

/* 1. Keyboard: while a text box has focus, hide the page bar so it doesn't float above the keyboard */
const isTextField=el=>el&&(el.tagName==="TEXTAREA"||el.tagName==="SELECT"||(el.tagName==="INPUT"&&!/^(checkbox|radio|button|submit)$/i.test(el.type)));

/* 2. Android Back (button or edge swipe) closes the newest open window first, instead of leaving the app.
   Each open window gets its own history step; closing it any other way removes that step again. */
(function(){
  const d=$("dlg"),vis=el=>!!el&&el.offsetParent!==null;
  const REG=()=>{const r=[];
    [["pn","page-np"],["lh","page-lilh"]].forEach(([id,pg])=>{const root=$(pg);
      r.push({id:id+"-panel",open:()=>!root.hidden&&["kitchen","recipes","safe"].some(k=>vis($(id+"-p-"+k))),close:()=>{const b=root.querySelector('[data-drop][aria-expanded="true"]');if(b)b.click()}});
      r.push({id:id+"-rq",open:()=>vis($(id+"-rq-box")),close:()=>{const b=root.querySelector("[data-rsearch]");if(b)b.click()}});
    });
    r.push({id:"shop-search",open:()=>vis($("shop-search")),close:()=>$("shop-sbtn").click()});
    r.push({id:"shop-cat",open:()=>vis($("shop-catpop")),close:()=>catOpen(false)});
    r.push({id:"dlg",open:()=>d.open,close:()=>d.close()});
    r.push({id:"dlg-pv",open:()=>d.open&&$("card").classList.contains("pv"),close:()=>{const b=$("card").querySelector("[data-pvback]");if(b)b.click()}});
    return r};
  /* v2.82: the app keeps its own scroll place; stepping back through history mustn't jump the page (that was the flash) */
  try{history.scrollRestoration="manual"}catch(_){}
  const LAYERS=[];let skip=0,skipHash=false,pending=[],again=false;
  const push=id=>{try{history.pushState({nphL:id},"");LAYERS.push(id)}catch(_){}};
  function sync(){
    if(skip){again=true;return}
    const reg=REG(),open=reg.filter(r=>r.open()).map(r=>r.id);
    const gone=LAYERS.filter(id=>!open.includes(id)),fresh=open.filter(id=>!LAYERS.includes(id));
    if(gone.length){
      const i=Math.min(...gone.map(g=>LAYERS.indexOf(g))),n=LAYERS.length-i;
      pending=[...LAYERS.slice(i).filter(id=>open.includes(id)),...fresh];LAYERS.splice(i);
      skip++;skipHash=true;try{history.go(-n)}catch(_){skip--;skipHash=false}return}
    fresh.forEach(push);
  }
  window.nphSync=()=>setTimeout(sync,0);
  window.nphSkipHash=()=>skipHash;
  window.addEventListener("popstate",()=>{
    if(skip){skip--;try{history.replaceState(null,"","#"+current)}catch(_){}
      setTimeout(()=>{skipHash=false},400);
      const p=pending;pending=[];p.forEach(push);if(again){again=false;sync()}return}
    const top=LAYERS.pop();if(!top)return;
    const l=REG().find(r=>r.id===top);if(l&&l.open())l.close();
    setTimeout(sync,0);
  });
  document.addEventListener("click",()=>setTimeout(sync,0));
  document.addEventListener("keydown",e=>{if(e.key==="Escape")setTimeout(sync,0)});
  d.addEventListener("close",()=>{d.style.transform="";d.classList.remove("sm","mid","dtop");setTimeout(sync,0)});
  const orig=d.showModal.bind(d);d.showModal=function(){orig();setTimeout(sync,0)};
})();

/* 3. Swipe down on a bottom sheet to close it */
(function(){const d=$("dlg");let y0=null,dy=0,ok=false;
  d.addEventListener("touchstart",e=>{if(window.innerWidth>560||e.touches.length>1)return;y0=e.touches[0].clientY;dy=0;ok=d.scrollTop<=0},{passive:true});
  d.addEventListener("touchmove",e=>{if(y0==null||!ok)return;dy=e.touches[0].clientY-y0;
    if(dy>0&&d.scrollTop<=0){e.preventDefault();d.classList.add("drag");d.style.transform=`translateY(${dy}px)`}else if(dy<0){ok=false;d.style.transform=""}},{passive:false});
  d.addEventListener("touchend",()=>{if(y0==null)return;d.classList.remove("drag");
    if(ok&&dy>110){d.close()}else d.style.transform="";y0=null;dy=0});
})();
