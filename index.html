<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NPH</title>

<style>
/* Layout: one-column app shell · page header → three top dropdowns (kitchen, recipes, safety) → week tabs → day cards (1, 2 or 3 per row) · fixed icon tab bar */
:root{

  --i-burger:#C27A2C; --i-pizza:#D0532F; --i-takeout:#C8402F; --i-curry:#C9850F; --i-sushi:#D1566B; --i-noodles:#B07E1C; --i-gyro:#5A9636; --i-kebab:#A8492F; --i-roast:#97582F; --i-sub:#B08636; --i-croissant:#C2862A; --i-bag:#8A6848; --ta:#C8402F;
  --i-drum:#D49418; --i-steak:#C43E3C; --i-fish:#278AD4; --i-egg:#DBA80A; --i-leaf:#369948; --i-bowl:#DB662E; --i-pot:#B8562C; --i-pasta:#D69E29; --i-rice:#B88E46; --i-wrap:#C28036; --i-toast:#B16E30; --i-cup:#8A522D; --i-porridge:#B8844F; --i-avo:#5E9D26; --i-apple:#D43A3B; --i-bean:#975C38; --i-pepper:#E0452B; --i-sausage:#B95C55; --i-cheese:#DCA709; --i-muffin:#CC518C; --i-cookie:#8A522D;
  --k-veg:#3F8A43; --k-meat:#B0413E; --k-chill:#B8901A; --k-bread:#A0672F; --k-grain:#C17F1E; --k-cup:#C25A2C; --k-frozen:#2F86C2; --k-bake:#B5527F; --k-snack:#7A4A2C; --k-lhmilk:#5C6BD6; --k-babycare:#2A8C88; --k-house:#6B6788;
  --swap:#4F7A0E; --warn:#A6520B; --warn-bg:#FBEEDB; --rep:#2B6CA8; --rep-bg:#E2EEFA; --k-fridge:#2F86A8; --k-freezer:#1D4ED8; --bad:#C0392B; --bad-bg:#FBE4E1; --keep:#0E7C76; --keep-bg:#DDF3F1; --shadow:0 10px 30px rgba(24,20,48,.18);
  --chicken:#C98E1E; --beef:#9B2C2C; --pork:#8A4F8A; --fish:#2F7FB5; --veg:#4C8C4A; --n:#C2477A; --p:#2F6E8E; --bf:#8A5A3C; --bake:#8C6239;
  --salmon:#D9604B; --egg:#B8960F; --plant:#4E9A5F;
  --display:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --acc:var(--np);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F16; --surface:#1F1F2A; --ink:#E9E9F1; --muted:#A5A5BB; --line:#33334A; --chip:#272734; --on-acc:#15151D;
  --np:#B3A0FF; --lilh:#78C3F0; --shop:#EC98DF; --ok:#6CC79B; --k-herbs:#A9CF72;
  --i-burger:#DDA56C; --i-pizza:#EE8A6A; --i-takeout:#E57B6E; --i-curry:#EBB651; --i-sushi:#EE93A3; --i-noodles:#E0B65C; --i-gyro:#93C474; --i-kebab:#DA8469; --i-roast:#CF9470; --i-sub:#DDBA74; --i-croissant:#E5B566; --i-bag:#C2A386; --ta:#E57B6E;
  --i-drum:#E1B45D; --i-steak:#D67876; --i-fish:#68ADE1; --i-egg:#E6C254; --i-leaf:#72B87F; --i-bowl:#E6946D; --i-pot:#CD896B; --i-pasta:#E2BB69; --i-rice:#CDB07E; --i-wrap:#D4A672; --i-toast:#C89A6E; --i-cup:#AD866C; --i-porridge:#CDA984; --i-avo:#8EBA67; --i-apple:#E17576; --i-bean:#B68D74; --i-pepper:#E97D6B; --i-sausage:#CE8D88; --i-cheese:#E6C153; --i-muffin:#DB85AE; --i-cookie:#AD866C;
  --k-veg:#7CC57E; --k-meat:#E8807A; --k-chill:#E6C559; --k-bread:#D9A26B; --k-grain:#EDB45C; --k-cup:#EE936A; --k-frozen:#7DC0EE; --k-bake:#E893BA; --k-snack:#C9946E; --k-lhmilk:#9CA7F2; --k-babycare:#6FCDC8; --k-house:#AAA6C8;
  --swap:#A8D46B; --warn:#F0A54A; --warn-bg:#3A2C17; --rep:#86BEF2; --rep-bg:#172738; --k-fridge:#6CC6E4; --k-freezer:#4C8DFF; --bad:#F08A80; --bad-bg:#3A1C1A; --keep:#5FD3C8; --keep-bg:#11302D; --shadow:0 10px 30px rgba(0,0,0,.5);
  --chicken:#E9B95A; --beef:#E07A7A; --pork:#C08BC0; --fish:#7FB6E0; --veg:#85C383; --n:#E88AB0; --p:#7EC0DE; --bf:#D2A07E; --bake:#D2A272;
  --salmon:#F2907E; --egg:#E6CB4C; --plant:#7CC48C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F16; --surface:#1F1F2A; --ink:#E9E9F1; --muted:#A5A5BB; --line:#33334A; --chip:#272734; --on-acc:#15151D;
  --np:#B3A0FF; --lilh:#78C3F0; --shop:#EC98DF; --ok:#6CC79B; --k-herbs:#A9CF72;
  --i-burger:#DDA56C; --i-pizza:#EE8A6A; --i-takeout:#E57B6E; --i-curry:#EBB651; --i-sushi:#EE93A3; --i-noodles:#E0B65C; --i-gyro:#93C474; --i-kebab:#DA8469; --i-roast:#CF9470; --i-sub:#DDBA74; --i-croissant:#E5B566; --i-bag:#C2A386; --ta:#E57B6E;
  --i-drum:#E1B45D; --i-steak:#D67876; --i-fish:#68ADE1; --i-egg:#E6C254; --i-leaf:#72B87F; --i-bowl:#E6946D; --i-pot:#CD896B; --i-pasta:#E2BB69; --i-rice:#CDB07E; --i-wrap:#D4A672; --i-toast:#C89A6E; --i-cup:#AD866C; --i-porridge:#CDA984; --i-avo:#8EBA67; --i-apple:#E17576; --i-bean:#B68D74; --i-pepper:#E97D6B; --i-sausage:#CE8D88; --i-cheese:#E6C153; --i-muffin:#DB85AE; --i-cookie:#AD866C;
  --k-veg:#7CC57E; --k-meat:#E8807A; --k-chill:#E6C559; --k-bread:#D9A26B; --k-grain:#EDB45C; --k-cup:#EE936A; --k-frozen:#7DC0EE; --k-bake:#E893BA; --k-snack:#C9946E; --k-lhmilk:#9CA7F2; --k-babycare:#6FCDC8; --k-house:#AAA6C8;
  --swap:#A8D46B; --warn:#F0A54A; --warn-bg:#3A2C17; --rep:#86BEF2; --rep-bg:#172738; --k-fridge:#6CC6E4; --k-freezer:#4C8DFF; --bad:#F08A80; --bad-bg:#3A1C1A; --keep:#5FD3C8; --keep-bg:#11302D; --shadow:0 10px 30px rgba(0,0,0,.5);
  --chicken:#E9B95A; --beef:#E07A7A; --pork:#C08BC0; --fish:#7FB6E0; --veg:#85C383; --n:#E88AB0; --p:#7EC0DE; --bf:#D2A07E; --bake:#D2A272;
  --salmon:#F2907E; --egg:#E6CB4C; --plant:#7CC48C; color-scheme:dark}

html,body{background:var(--bg)}
body{min-height:100vh}
body{margin:0}

[hidden]{display:none!important}
body{color:var(--ink);font-family:var(--body);font-size:var(--fs-body);line-height:1.45;-webkit-tap-highlight-color:transparent}
.pg-pn{--acc:var(--np)} .pg-lh{--acc:var(--lilh)} .pg-shop{--acc:var(--shop)}
.page{max-width:1100px;margin:0 auto;padding-top:18px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:var(--fs-h1);font-weight:800;letter-spacing:-.01em;color:var(--acc)}
h2{font-size:var(--fs-h2);font-weight:800}
h3{font-size:var(--fs-title);font-weight:800}
button{font-family:var(--body);color:inherit}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.note{font-size:var(--fs-sm);color:var(--muted);margin:0;max-width:68ch}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* page header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top.nowrap{flex-wrap:nowrap}
.top.nowrap h1{min-width:0}
.topright{display:flex;align-items:center;gap:8px}


.search{display:flex;align-items:center;gap:8px;height:38px;box-sizing:border-box;padding:0 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);cursor:text;margin-top:-6px}
.search:focus-within{border-color:var(--acc)}
.search .ic{width:16px;height:16px;color:var(--muted);flex:none}
.search:focus-within .ic{color:var(--acc)}
.search input{all:unset;flex:1;min-width:0;font:600 var(--fs-body) var(--body);color:var(--ink)}
.search input::placeholder{color:var(--muted);font-weight:500}
.top .sub{margin:4px 0 0;color:var(--muted);font-weight:600;font-size:var(--fs-body)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-cap);font-weight:700;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--ok)} .sync.local i{background:var(--warn)} .sync.ro i{background:var(--shop)}

/* folds */
.fold{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.fold>summary{cursor:pointer;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h2{display:flex;align-items:center;gap:8px}
.fold>summary h2::after{content:"▾";font-size:var(--fs-sm);color:var(--muted)}
.fold[open]>summary h2::after{content:"▴"}
.status{font-size:var(--fs-sm);font-weight:700;color:var(--muted)}
.status.bad{color:var(--warn)}
.fbody{padding:0 16px 16px;display:grid;gap:14px}
.label{margin:0 0 6px;font:700 var(--fs-cap) var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:5px 11px;border-radius:99px;border:1.5px solid var(--line);font-size:var(--fs-sm);font-weight:600;cursor:pointer;color:var(--muted);text-decoration:line-through}
.pill input:checked+span{background:color-mix(in srgb,var(--pc,var(--acc)) 15%,var(--surface));border-color:var(--pc,var(--acc));color:var(--pc,var(--acc));text-decoration:none}
.pgroup .label{color:var(--pc);display:flex;align-items:center;gap:6px}
.pgroup .label .ic{width:15px;height:15px}
.pill input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
.uses{display:flex;flex-wrap:wrap;gap:5px}
.uses span{font-size:var(--fs-sm);font-weight:600;padding:2px 9px;border-radius:99px;background:var(--chip);border:1px solid var(--line)}
.uses span.out{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:7px 12px;font-weight:700;font-size:var(--fs-sm);cursor:pointer;display:inline-flex;align-items:center;gap:6px}

/* week bar + calendar */
/* week tabs: slim segmented bar, same style as the top tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tab{border:none;background:transparent;border-radius:10px;padding:5px 4px;cursor:pointer;text-align:center;display:grid;gap:0;min-width:0;font-weight:800;font-size:var(--fs-sm);line-height:1.2;transition:background .15s}
.tab small{font-weight:600;font-size:var(--fs-cap);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tab[aria-selected="true"]{background:var(--acc);color:var(--on-acc)}
.tab[aria-selected="true"] small{color:var(--on-acc);opacity:.85}
.tab.now{box-shadow:inset 0 0 0 2px var(--acc)}
.tab.now[aria-selected="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--acc)}
.calrow{display:flex;justify-content:flex-end;gap:6px;margin-top:-8px}
.todaybtn{border:1.5px solid var(--line);background:var(--surface);color:var(--acc);border-radius:10px;font-weight:800;font-size:var(--fs-sm);cursor:pointer;padding:0 12px;height:32px}
.calbtn{width:44px;height:32px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.calbtn .ic{width:17px;height:17px}
.calbtn[aria-expanded="true"]{border-color:var(--acc);color:var(--acc)}
.drop.info .dt{white-space:normal}
@media (max-width:440px){.drop.info .ds{display:none}}
.infosec{display:grid;gap:6px}
.infosec h3{font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dpanel .infosec .itx,.dpanel .infosec li{margin:0;font-size:var(--fs-body);font-weight:400;color:var(--ink);line-height:1.5}
.dpanel .infosec b{color:var(--acc);font-weight:700}
.dpanel .infosec b.w{color:var(--warn)}
.lkey{font:800 var(--fs-cap) var(--body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;max-width:360px;box-sizing:border-box;display:grid;gap:8px;justify-self:end}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead b{font-family:var(--display);font-size:var(--fs-title)}
.navb{border:1.5px solid var(--line);background:transparent;border-radius:8px;min-width:32px;height:32px;cursor:pointer;font-size:var(--fs-body);font-weight:700;padding:0 8px}
.calgrid{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.calgrid .h{font-size:var(--fs-cap);font-weight:700;color:var(--muted);text-transform:uppercase;padding:2px 0}
.calgrid .wk{font-size:var(--fs-cap);font-weight:700;color:var(--muted);align-self:center}
.cd{border:none;background:transparent;border-radius:8px;padding:6px 0;cursor:pointer;font:600 var(--fs-sm) var(--body);font-variant-numeric:tabular-nums}
.cd.other{color:var(--muted);opacity:.55}
.cd.inview{background:var(--chip)}
.cd.today{box-shadow:inset 0 0 0 2px var(--acc)}
.cd.sel{background:var(--acc);color:var(--on-acc)}
.viewlabel{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.viewlabel span{font-size:var(--fs-sm);color:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:var(--fs-sm);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .ic{width:15px;height:15px}

/* day cards */
.days{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.days.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.days.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.days.auto{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
@media (max-width:599px){.days.auto{grid-template-columns:minmax(0,1fr)}.days.auto .day{padding:16px;gap:10px}.days.auto .day h3{font-size:var(--fs-h2)}.days.auto .meal{padding:10px 12px;gap:12px}.days.auto .meal b{font-size:var(--fs-title)}.days.auto .meal em{font-size:var(--fs-sm)}.days.auto .meal .bub{width:44px;height:44px}.days.auto .meal .bub .ic{width:22px;height:22px}.days.auto .swap{width:46px}}
.layout .lauto{width:auto;padding:0 10px;font-weight:800;font-size:var(--fs-cap)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px;align-content:start}
.day.today{border:2px solid var(--acc)}
.day.picked{outline:2px dashed var(--acc);outline-offset:2px}
.day header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.badge{font-size:var(--fs-cap);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--acc)}
.grp{display:grid;gap:6px;border-radius:12px;transition:background .15s,box-shadow .15s}
.grp.drop{box-shadow:0 0 0 2px var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.grp.lift{opacity:.35}
.row{display:flex;gap:6px;align-items:stretch}
.grip{flex:none;width:22px;border:none;background:transparent;color:var(--muted);cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:grid;place-items:center;padding:0;border-radius:8px}
.grp.pressing{transition:transform .45s,background .45s;transform:scale(.985);background:color-mix(in srgb,var(--acc) 6%,transparent)}
.grip .ic{width:16px;height:16px}
.grip.sp{visibility:hidden;pointer-events:none}
.meal{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;display:flex;gap:9px;align-items:center;background:var(--chip);border-radius:11px;padding:7px 10px}
.meal .bub{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 17%,transparent)}
.meal .bub .ic{width:19px;height:19px;stroke-width:1.9}
.meal .tx{display:grid;gap:1px;min-width:0}
.meal small{font-size:var(--fs-cap);color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meal b{font-weight:700;font-size:var(--fs-body)}
.meal em{font-style:normal;font-size:var(--fs-cap);font-weight:600;color:var(--muted)}
.meal.cook em{color:var(--muted)}
.meal.left{opacity:.82}
.meal.miss{background:var(--warn-bg);opacity:1}
.meal.miss em{color:var(--warn);font-weight:700}
.meal.dash{background:transparent;border:1.5px dashed var(--tcol,var(--c))}
.meal:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.swap{border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:11px;width:40px;cursor:pointer;flex:none;display:grid;place-items:center}
.swap.hot{border-color:var(--warn);color:var(--warn)}
.huc .hchev{width:13px;height:13px;margin-left:2px;transition:transform .2s}
.legend.hu.huopen [data-hulist] .hchev{transform:rotate(180deg)}
/* v2.79: the heads-up list drops down under the toolbar */
.hudrop{position:absolute;left:0;right:0;top:calc(100% - 6px);padding-left:inherit;padding-right:inherit;display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s cubic-bezier(.2,.8,.2,1);background:var(--bg);border-radius:0 0 18px 18px;pointer-events:none}
.stick:has(.hudrop.open)::after{opacity:0}
.hudrop{z-index:1}
.hudrop.open{grid-template-rows:1fr;pointer-events:auto;box-shadow:0 14px 22px -12px rgb(0 0 0/.35)}
.hudin{overflow:hidden;min-height:0}
.hulst{display:grid;gap:6px;padding:2px 0 12px}
.hurow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--c);font-weight:700;font-size:var(--fs-sm)}
.hurow>.ic{width:17px;height:17px;flex:none}
.hurow span{flex:1;min-width:0;color:var(--ink)}
.hurow .hrchev{width:14px;height:14px;transform:rotate(-90deg);color:var(--muted)}
.hurow:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
@media (prefers-reduced-motion:no-preference){.hudrop.open .hurow{animation:hurin .22s cubic-bezier(.2,.8,.2,1) both}}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* remove-meal popup buttons: two equal, plain buttons */
.acts.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts.two .todaybtn{min-height:42px;font-size:var(--fs-body)}
.days .mw>.meal{padding-right:38px!important}
@media (pointer:coarse){.days .mw>.meal{padding-right:42px!important}}
/* key sits on the same row as Today and the calendar button */
.stick{grid-template-columns:minmax(0,1fr)}
.keyrow{align-items:center;gap:8px;min-width:0}
.keyrow>.todaybtn,.keyrow>.calbtn{flex:none}
.keyrow .legend{flex:1;min-width:0;margin-right:auto;align-self:center}
.stick .keyrow{margin-top:-2px}
@media (max-width:699px){.keyrow .legend{-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent);padding-right:18px}}
/* every window is a bottom sheet on phones (slides up, swipe down to close); centred on bigger screens */
@media (max-width:560px){
  dialog.sm{max-width:100%}
  dialog .card{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  dialog .card.rc{padding-bottom:0}
}
@media (max-width:560px) and (prefers-reduced-motion:no-preference){dialog[open]{animation:sheetup .24s cubic-bezier(.2,.8,.2,1)}}
@media (min-width:561px) and (prefers-reduced-motion:no-preference){dialog[open]{animation:popin .16s ease-out}}
@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
/* Touch areas (style guide 4.3): on touch screens small buttons get an invisible touch area that reaches into the free space
   around them: half of each gap to a neighbouring control, and up to 44px in total. Sizes and gaps don't change. */
@media (pointer:coarse){
  :is(.calbtn,.todaybtn,.navb,.hsplit,.close,.setb,.sbtn,.huc,.wkmore,.tick,.fav,.pvb,.pvok,.cqc,.amt,.cd,.del,.split,.qty button,.cqbox button,.fhead,.ptabs>button,.setseg>button){position:relative}
  .cqbox .cqc,.cqbox>button{position:relative!important}
  :is(.calbtn,.todaybtn,.navb,.hsplit,.close,.setb,.sbtn,.huc,.wkmore,.tick,.fav,.pvb,.pvok,.cqc,.amt,.cd,.del,.split,.qty button,.cqbox button,.fhead,.ptabs>button,.setseg>button)::after{content:"";position:absolute;top:calc(-1*var(--tt,0px));bottom:calc(-1*var(--tb,0px));left:calc(-1*var(--tl,0px));right:calc(-1*var(--tr,0px))}
  .keyrow>:is(.calbtn,.todaybtn){--tt:7px;--tr:2px;--tb:7px;--tl:2px}
  #shop-tools>:is(.calbtn,.todaybtn){--tt:5px;--tr:2px;--tb:7px;--tl:2px}
  #shop-tools.ckd>:is(.calbtn,.todaybtn){--tt:2.5px;--tr:2px;--tb:7px;--tl:2px}
  .dpanel .ptools>:is(.calbtn,.todaybtn){--tt:5px;--tr:2px;--tb:5px;--tl:2px}
  .lset>.huc{--tt:5px;--tr:0px;--tb:5px;--tl:0px}
  .row>.sbtn{--tt:0px;--tr:2.5px;--tb:0px;--tl:2.5px}
  .day header>.hsplit{--tt:9px;--tr:2px;--tb:5px;--tl:2px}
  .wkdiv>.wkmore{--tt:10px;--tr:0px;--tb:10px;--tl:0px}
  .item>.tick{--tt:5px;--tr:4px;--tb:5px;--tl:5px}
  .cqbox>.cqc{--tt:8px;--tr:0px;--tb:8px;--tl:0px}
  .imeta>.amt{--tt:6.5px;--tr:0px;--tb:6.5px;--tl:0px}
  .iedit>.calbtn{--tt:5px;--tr:3px;--tb:5px;--tl:3px}
  .calgrid>.cd{--tt:2px;--tr:0px;--tb:2px;--tl:0px}
  .calhead>.navb{--tt:7px;--tr:7px;--tb:7px;--tl:7px}
  .navb.calto{--tt:4px;--tr:0px;--tb:4px;--tl:0px}
  dialog header>.close{--tt:8px;--tr:8px;--tb:8px;--tl:8px}
  .rbar>:is(.close,.pvb,.pvok){--tt:3px;--tr:3px;--tb:3px;--tl:3px}
  .fch>.fdate{--tt:7px;--tr:7px;--tb:7px;--tl:7px}
  .ptabs>button{--tt:2.5px;--tr:0px;--tb:2.5px;--tl:0px}
  :is(.facts2,.empty)>.todaybtn{--tt:4px;--tr:0px;--tb:4px;--tl:0px}
  .acts>.todaybtn{--tt:1px;--tr:0px;--tb:1px;--tl:0px}
  .addrow>.addbtn{--tt:2px;--tr:0px;--tb:2px;--tl:0px}
  .setseg>button{--tt:3px;--tr:0px;--tb:3px;--tl:0px}
  .qty>button{--tt:3px;--tr:3px;--tb:3px;--tl:3px}
  .favs>.fav{--tt:8px;--tr:0px;--tb:8px;--tl:0px}
  .setb{--tt:5px;--tr:5px;--tb:5px;--tl:5px}
  .keyrow .lwin{padding-block:6px;margin-block:-6px}
  .item .imeta{clip-path:inset(-13px 0 -13px 0);overflow:visible!important}
}
}
@keyframes popin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
/* --- compact pass: thinner week tabs, tighter pinned bar, slimmer page bar --- */
.tabs{padding:3px;border-radius:12px}
.tab{padding:3px 4px;font-size:var(--fs-sm);line-height:1.15;border-radius:9px}
.tab small{font-size:.62rem}
.stick{gap:7px;padding-top:6px;padding-bottom:7px}
.stick .keyrow{margin-top:-1px}
.keyrow>.todaybtn,.keyrow>.calbtn{min-height:34px;height:34px}
.keyrow>.calbtn{width:42px}
.tabbar button{padding:5px 4px 4px;gap:1px;font-size:var(--fs-cap)}
.tabbar .ic{width:21px;height:21px;stroke-width:1.7}
.tabbar button[aria-current="page"]::before{left:34%;right:34%;height:2px}
.tabbar .count{top:2px;min-width:15px;height:15px;font-size:.6rem}
.page{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
/* two pinned layers on the meal pages: top tabs, then week tabs + key */
.stick.s1{padding-bottom:4px}
.stick.s2{margin-top:-14px;padding-top:3px}
.page>.dpanel{margin-bottom:12px}
.stick.s1.stuck{box-shadow:none}
.themeseg{justify-self:start}
.themeseg button{padding:6px 16px}

/* swap list: view-recipe button on each bar */
.optrow{display:flex;align-items:stretch;border-radius:10px;background:var(--chip)}
.optrow .opt{flex:1;min-width:0;background:none;border-radius:10px 0 0 10px}
.optrow.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.optrow .opt.cur{box-shadow:none}
.optrow.off .opt{opacity:.45}
.optmore{flex:none;width:38px;border:none;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:0 10px 10px 0;position:relative}
.optmore::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:1px;background:var(--line)}
.optmore .ic{width:18px;height:18px}
.optmore:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.optrow .opt:focus-visible{outline-offset:-3px}

/* recipe window: the title bar stays pinned while you scroll */
.rbar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;background:color-mix(in srgb,var(--c) 13%,var(--surface))}
.rbar h2{flex:1;min-width:0;font-size:var(--fs-h2);line-height:1.15}
.rbar .big{width:40px;height:40px;border-radius:12px;background:var(--surface);color:var(--c);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(30,24,60,.12)}
.rbar .big .ic{width:22px;height:22px;stroke-width:1.7}
.rbar .close{background:var(--surface);border-radius:50%;width:34px;height:34px;padding:0;display:grid;place-items:center;flex:none}
.pvb,.pvok{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.pvb .ic{transform:rotate(90deg);width:20px;height:20px}
.pvb.pen .ic{transform:none;width:17px;height:17px}
.pvok{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.pvok .ic{width:20px;height:20px;stroke-width:2.6}
.pvok[disabled]{opacity:.4;cursor:default}
.card.rc .rhero{padding-top:2px}
.rtop{align-items:center;gap:8px;flex-wrap:wrap}
.pvwhy{font-size:var(--fs-cap);font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:2px 9px}
@media (max-width:560px){dialog .rbar{padding-top:22px}dialog::before{z-index:4}}

/* key: scrolls slowly on a loop when it doesn't fit */
.legend .lwin{flex:1;min-width:0;overflow:hidden;display:flex}
.legend .ltrack{display:flex;flex:none}
.legend .lset{display:flex;flex-wrap:wrap;gap:6px 12px;flex:none}
.stick .legend .lset{flex-wrap:nowrap}
.legend.marq .lset{padding-right:22px}
.legend.marq .lwin{-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 22px),transparent)}
.legend.marq .ltrack{animation:lmarq var(--ldur,30s) linear infinite}
@keyframes lmarq{to{transform:translateX(-50%)}}
@media (hover:hover){.legend.marq:hover .ltrack{animation-play-state:paused}}
@media (prefers-reduced-motion:reduce){.legend.marq .ltrack{animation:none}.legend.marq .lset+.lset{display:none}.legend .lwin{overflow-x:auto;scrollbar-width:none}}
@media (min-width:700px){.stick .legend .lset{flex-wrap:wrap}}
@media (max-width:699px){.keyrow .legend{-webkit-mask-image:none;mask-image:none;padding-right:0}}
.keyrow .legend{display:flex;align-items:center;gap:10px;overflow:visible!important}
.keyrow .legend .lkey{flex:none}

/* swap list: had recently, still pickable */
.optrow.rep{background:var(--rep-bg)}
.optrow.rep .opt small{color:var(--rep);font-weight:700;white-space:nowrap}
.optrow.rep .optmore{color:var(--rep)}
.optrow.rep.nut{background:var(--warn-bg)}.optrow.rep.nut .opt small,.optrow.rep.nut .optmore{color:var(--warn)}
.subo.dwarn small{color:var(--warn)!important;font-weight:700}
.rcn.dwarn{color:var(--warn)!important}
.optrow.rep .optmore::before{background:color-mix(in srgb,var(--rep) 30%,transparent)}
.pvwhy.rep{color:var(--rep);background:var(--rep-bg)}
.todaybtn.backplan{display:block;text-align:center}
.backplan span{font-weight:800}

/* swap list: out of stock, but fixable with a swap */
.optrow.fix{background:var(--warn-bg)}
.optrow.fix .opt small{color:var(--warn);font-weight:700}
.optrow.fix .optmore{color:var(--warn)}
.optrow.fix .optmore::before{background:color-mix(in srgb,var(--warn) 30%,transparent)}
.pvwhy.fix{color:var(--warn);background:var(--warn-bg)}
.pvwhy.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent);display:inline-flex;align-items:center;gap:4px}
.pvwhy.ok .ic{width:13px;height:13px;stroke-width:2.6}
.need.fixme{box-shadow:0 0 0 2px var(--warn);animation:fixpulse 1.6s ease-in-out 2}
@keyframes fixpulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 35%,transparent)}}
.need.opt{opacity:.75}
.need small{font-size:var(--fs-cap);font-weight:700;opacity:.8;margin-left:2px}
.subo[disabled]{opacity:.4;cursor:default}
/* page footer: appearance on the left, version in the middle */
main.page{padding-bottom:10px!important;min-height:calc(100vh - 150px - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - 150px - env(safe-area-inset-bottom,0px))}
html.kb main.page{min-height:0}
.appfoot{padding:6px max(var(--gut),env(safe-area-inset-left,0px)) calc(78px + env(safe-area-inset-bottom,0px))}
.appfoot .in{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}





.appfoot .ver{font-size:var(--fs-cap);color:var(--muted);opacity:.7;letter-spacing:.04em}
html.kb .appfoot{padding-bottom:16px}

/* planner pages: appearance and version share the row with "Days per row" */
.pagefoot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:4px}

.pagefoot .ver{text-align:center;font-size:var(--fs-cap);color:var(--muted);opacity:.7;letter-spacing:.04em;white-space:nowrap}
.pagefoot .layout{justify-self:end}
@media (max-width:420px){.pagefoot .layout>span{display:none}}
body[data-page="np"] .appfoot .in,body[data-page="lilh"] .appfoot .in{display:none}
body[data-page="np"] .appfoot,body[data-page="lilh"] .appfoot{padding-top:0}
/* Info & safety: food preferences */
.ptabs{display:flex;gap:6px}
.ptabs button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-weight:800;font-size:var(--fs-sm);color:var(--muted);cursor:pointer}
.ptabs button .ic{width:16px;height:16px}
.ptabs button[aria-selected="true"]{border-color:var(--pc);color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--surface))}
.ppane{display:grid;gap:10px;border-left:3px solid var(--pc);padding:2px 0 2px 12px}
.pgrp h4{margin:0 0 3px;font-size:var(--fs-cap);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
.pgrp ul{margin:0;padding-left:18px;display:grid;gap:2px}

/* swap list: only keeps 2 days (teal), still pickable */
.optrow.keep{background:var(--keep-bg)}
.optrow.keep .opt small{color:var(--keep)}
.optrow.keep .optmore{color:var(--keep)}
.optrow.keep .optmore::before{background:color-mix(in srgb,var(--keep) 30%,transparent)}
.pvwhy.keep{color:var(--keep);background:var(--keep-bg)}
/* recalculate */
.keyrow>.calbtn.recalc{flex:none}
.card .reclist{list-style:none;margin:0 0 14px;padding:0!important;display:grid;gap:8px;max-height:46vh;overflow:auto}
.reclist li{background:var(--chip);border-radius:11px;padding:8px 11px;display:grid;gap:2px}
.reclist small{font-size:var(--fs-cap);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.reclist .rcx{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:var(--fs-body)}
.reclist s{color:var(--muted);text-decoration-thickness:1px}
.reclist .rarr{width:14px;height:14px;transform:rotate(-90deg);color:var(--muted)}
.reclist em{font-style:normal;font-size:var(--fs-cap);color:var(--warn);font-weight:700}

/* recipe window: Cook with / Makes drop-downs, same look as the fact tiles */
.facts{position:relative}
.fact.dd{padding:0;position:relative}
.fact .ddb{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;padding:8px 26px 8px 10px;width:100%;height:100%;border-radius:12px;position:relative}
.fact .ddb:focus-visible{outline:2px solid var(--c)}
.fact .ddc{position:absolute;right:7px;top:9px;width:13px;height:13px;color:var(--muted);transition:transform .15s}
.fact.open .ddc{transform:rotate(180deg)}
.fact.open{box-shadow:inset 0 0 0 1.5px var(--c)}
.ddm{position:absolute;top:calc(100% + 6px);left:0;z-index:5;min-width:100%;width:max-content;max-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;display:grid;gap:2px;box-shadow:var(--shadow)}
.ddm.right{left:auto;right:0}
.ddm button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;font-size:var(--fs-sm);font-weight:700}
.ddm button span{display:grid;gap:1px;flex:1}
.ddm button small{font:600 var(--fs-cap) var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.ddm button .ic{width:14px;height:14px;color:var(--c)}
.ddm button .ddk{color:var(--c);width:14px;height:14px}
.ddm button[aria-checked="true"]{background:color-mix(in srgb,var(--c) 12%,transparent)}
.ddm button[disabled]{opacity:.45;cursor:default}

.mconv{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:12px;padding:10px 12px;margin-bottom:10px}
.mconv>.ic{width:18px;height:18px;color:var(--c);flex:none;margin-top:2px}
.mconv p{margin:0;font-size:var(--fs-body);line-height:1.5}
.reclist .rcn{display:flex;align-items:center;gap:5px;font-size:var(--fs-sm);color:var(--muted)}
.reclist .rcn .ic{width:13px;height:13px}
/* v2.80: tick to replace leftovers that are already cooked */
.rtick{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:var(--fs-sm);font-weight:700;color:var(--ink);cursor:pointer;min-height:32px}
.rtick input{width:20px;height:20px;accent-color:var(--acc);margin:0;flex:none}
.pgrp h4{display:flex;align-items:center;gap:5px}
.pgrp h4 .ic{width:13px;height:13px;stroke-width:2.4}

/* Makes menu: a choice that reshuffles the next meal */
.ddm button.warn small{color:var(--warn);font-weight:700}
.ddm button.warn .ic{color:var(--warn)}
.ddm button.warn{background:color-mix(in srgb,var(--warn) 9%,transparent)}
.pvwhy .ic{width:12px;height:12px;vertical-align:-1px;margin-right:3px}

/* shopping "Add": the closed category box looks like its category tab; "Select" until one is picked */
.addrow .catbtn{border-left:4px solid var(--kc)}
.addrow .catbtn.unset{--kc:var(--acc);color:var(--acc)}
.addrow .catbtn.unset span{color:var(--acc)}
.addrow .catbtn:not(.unset):focus-visible,.addrow .catbtn:not(.unset)[aria-expanded="true"]{border-color:var(--kc)}

/* shopping "Add": the category box always uses the category's own colour (closed, open or focused) */
.addrow .catbtn:not(.unset) .ic.cic,.addrow .catbtn:not(.unset) .chev{color:var(--kc)}
.addrow .catbtn:not(.unset):focus-within,.addrow .catbtn:not(.unset):focus,.addrow .catbtn:not(.unset)[aria-expanded="true"]{border-color:var(--kc)}
.addrow .catbtn:not(.unset){border-left-color:var(--kc)}
.addrow .catbtn.unset .ic.cic,.addrow .catbtn.unset .chev{color:var(--acc)}

/* ===== Stock: cooked food ===== */
.whotabs{margin-top:8px}
.ds.bad{color:var(--bad)!important;font-weight:800}
.drop[aria-pressed="true"] .ds.bad{color:var(--on-acc)!important}
.cathead .cn.bad{color:var(--bad)}
.fcards{display:grid;gap:10px;padding:12px}
.fempty{margin:0;padding:12px 14px;color:var(--muted);font-size:var(--fs-sm)}
.fcard{background:var(--chip);border-radius:14px;padding:12px;display:grid;gap:6px;border:1.5px solid transparent}
.fcard.soon{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.fcard.exp{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--chip))}
.fch{display:flex;align-items:center;gap:10px}
.fch .bub{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c);display:grid;place-items:center;flex:none}
.fch .bub .ic{width:18px;height:18px}
.fch b{flex:1;min-width:0;font-size:var(--fs-body);line-height:1.25}
.fch .fp{font-size:var(--fs-sm);font-weight:800;color:var(--muted);white-space:nowrap}
.fcard .del{border:none;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:2px 6px;border-radius:8px;line-height:1}
.fcard .del.arm{font-size:var(--fs-cap);font-weight:800;color:var(--on-acc);background:var(--bad);padding:5px 8px}
.fmeta{margin:0;font-size:var(--fs-cap);color:var(--muted)}
.fbar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.fbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.fcard.soon .fbar i{background:var(--warn)}
.fcard.exp .fbar i{background:var(--bad)}
.fleft{margin:0;font-size:var(--fs-sm);font-weight:700}
.fcard.soon .fleft{color:var(--warn)}
.fcard.exp .fleft{color:var(--bad)}
.fplan{margin:0;display:flex;align-items:center;gap:5px;font-size:var(--fs-sm);color:var(--muted)}
.fplan .ic{width:13px;height:13px}
.fcard.exp .fplan{color:var(--bad)}
.facts2{display:flex;gap:8px;margin-top:2px}
.facts2 .todaybtn{flex:1;min-height:36px}
.facts2 .todaybtn .ic{width:15px;height:15px}
.facts2 .todaybtn[disabled]{opacity:.45}
/* store buttons on today's meal cards */
.mw.hasst>.meal{padding-bottom:36px!important}
.stbtns{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.stb{width:30px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--k-fridge)}
.stb.fz{color:var(--k-freezer)}
.stb .ic{width:16px;height:16px}
.meal.stored{background:color-mix(in srgb,var(--k-fridge) 10%,var(--chip))}
.meal.stored em{color:var(--k-fridge);font-weight:700}
/* store popup */
.stmeal{display:flex;align-items:center;gap:10px;margin:2px 0 10px}

 paprikas:{n:"Csirkepaprikás (chicken paprikash)",t:"chicken",ic:"pepper",m:"Hob",time:"50 min",need:["chthigh","onion","pepper","paprika","puree","stock","pasta"],
  ing:["1kg chicken thigh fillets, cut into large chunks","2 onions, finely chopped","2 red peppers, sliced","2 tbsp sweet paprika","2 tbsp tomato purée","400ml chicken stock (1 cube)","1 tbsp oil, salt and pepper","Wholewheat pasta, about 75g each, cooked fresh each night"],
  s:["Heat the oil in a wide pan on low. Cook the onions 8–10 min until soft and golden but not browned.","Take the pan off the heat and stir in the paprika for 30 seconds. On high heat it burns and turns bitter.","Back on the heat: add the chicken, peppers, purée and stock. Season. Bring to a gentle bubble.","Lid on, simmer 30–35 min, stirring now and then, until the chicken is tender.","Lid off for the last 10 min if you want a thicker sauce.","Each night, cook the pasta 10 min, drain and spoon the paprikás over."],
  tip:"Tastes better on day 2. Reheat gently with a splash of water.",nw:"Stir 2 tbsp soured cream into her bowl. That's how it's served in Hungary."},
 rizseshus:{n:"Rizses csirke (paprika chicken & rice)",t:"chicken",ic:"rice",m:"Hob",time:"45 min",need:["chthigh","onion","pepper","paprika","stock","rice","peas"],
  ing:["1kg chicken thigh fillets, diced","2 onions, finely chopped","2 peppers, diced","1½ tbsp sweet paprika","500ml chicken stock","A handful of frozen peas","Basmati rice, about 75g each, cooked fresh each day","Fresh parsley (optional)"],
  s:["Soften the onions in a little oil on a low heat, 8 min.","Off the heat, stir in the paprika. Back on, add the chicken and fry 5 min until it turns white all over.","Add the peppers and stock. Simmer 25 min with the lid half on until the chicken is tender and the sauce has reduced.","Stir in the peas for the last 3 min.","Each day: rinse the rice, then simmer 10–12 min (1 part rice to 1½ parts water, lid on). Fork it through the chicken."],
  tip:"The chicken keeps 2 days. Only make the rice you'll eat that day.",nw:"A dollop of soured cream and a pickled cucumber, the Hungarian way.",note:"Cool rice within an hour and eat within 24 hours. Never batch-reheat rice more than once."},
 beefstew:{n:"Beef & root veg stew",t:"beef",ic:"pot",m:"Slow cooker",time:"15 min + 8 h",need:["beef","onion","carrot","parsnip","potato","stock","puree","mixedherbs","bayleaf"],
  ing:["800g diced beef","2 tbsp plain flour, salt and pepper","2 onions, in chunks","3 carrots and 2 parsnips, in chunks","600g potatoes, in 3cm chunks","2 tbsp tomato purée","600ml beef stock (2 cubes)","1 tsp mixed herbs, 1 bay leaf"],
  s:["Toss the beef in the seasoned flour.","If you have 5 min, brown it in a hot pan in two batches. It adds a lot of flavour but is optional.","Put the veg in the slow cooker first (it cooks slower than meat), then the beef.","Whisk the purée into the stock and pour over. Add the mixed herbs and bay leaf.","Low for 8 hours or high for 5, until the beef falls apart.","Fish out the bay leaf. Serve with crusty bread or sourdough."],
  tip:"Too thin? Lid off on high for the last 30 min.",nw:"A spoon of soured cream on top, or cheddar on her bread.",tags:["Freezes well"]},
 toltott:{n:"Töltött paprika (stuffed peppers)",t:"beef",ic:"pepper",m:"Slow cooker",time:"20 min + 6 h",max:2,need:["mince","pepper","rice","onion","eggs","passata|tomtins","paprika"],
  ing:["6 peppers (pale Hungarian ones if you find them; any sweet pepper works)","600g beef mince","100g basmati rice, rinsed (raw)","1 onion, grated","1 egg","2 tsp sweet paprika, salt and pepper","700g passata + 200ml water + 1 tsp sugar"],
  s:["Cut the tops off the peppers and pull out the seeds.","Mix the mince, raw rice, onion, egg, paprika, salt and pepper with your hands.","Stuff the peppers loosely. The rice swells as it cooks.","Stand them up in the slow cooker with the tops back on.","Pour the passata, water and sugar around them.","Low 6–7 hours, until the peppers are soft and the rice in the middle is tender."],
  tip:"Serve with mash or bread to mop up the sauce.",nw:"Soured cream on top. That's the classic.",note:"Has rice inside, so cool it within an hour and eat within a day. Freeze spare portions straight away."},
 bbqchicken:{n:"BBQ chicken & wedges",t:"chicken",m:"Air fryer",time:"30 min",need:["chthigh","bbq","wedges","peas|broccoli"],
  ing:["1kg chicken thigh fillets","2 tbsp BBQ seasoning + 1 tbsp oil","Frozen potato wedges (a portion each night)","Frozen peas or broccoli"],
  s:["Rub the chicken all over with the oil and seasoning.","Air fry at 200°C for 18–20 min in two batches, turning halfway. It's done when the juices run clear and there's no pink in the middle.","Let it cool, then fridge what you're not eating tonight.","Each night: wedges at 200°C for 15 min, add a portion of chicken for the last 4–5 min.","Microwave the veg with a knob of butter."],
  tip:"Slice the leftover chicken into wraps for a quick lunch.",nw:"Dip: soured cream with snipped chives."},
 salmonpot:{n:"Salmon, potatoes & broccoli",t:"fish",m:"Air fryer",time:"20 min",max:2,need:["salmon","potato","broccoli","lemon","dill"],
  ing:["4 salmon fillets (2 a night)","600g potatoes, in small chunks","Frozen broccoli","1 lemon, a knob of butter, dill (or chives)"],
  s:["Day 1: boil all the potatoes in salted water for 15 min until a knife slides in. Fridge half.","Pat 2 fillets dry and season. Air fry skin side down at 180°C for 10–12 min, until it flakes easily.","Steam or microwave the broccoli.","Toss the potatoes with butter and dill, squeeze lemon over the fish.","Day 2: same again with the other 2 fillets. Crisp the cold potatoes in the air fryer at 200°C for 10 min."],
  nw:"Tzatziki on the side.",note:"Cook the fish fresh each night. Reheated salmon goes dry."},
 goulash:{n:"Gulyás (beef goulash)",t:"beef",ic:"bowl",m:"Slow cooker",time:"20 min + 8 h",need:["beef","onion","carrot","parsnip","potato","pepper","paprika","puree","stock","marjoram"],
  ing:["800g diced beef","2 onions, chopped","2 carrots and 1 parsnip, in chunks","500g potatoes, in chunks","1 red pepper, diced","2 tbsp sweet paprika","1 tbsp tomato purée","1 tsp dried marjoram","1 tsp caraway seeds (optional, very Hungarian)","1 litre beef stock"],
  s:["Soften the onions in a little oil, 5–8 min.","Off the heat, stir the paprika and caraway into the onions.","Tip into the slow cooker with the beef, veg, purée, stock and marjoram.","Low 8 hours. It should sit between a soup and a stew.","Taste and season. Serve in bowls with bread."],
  tip:"Gulyás is a soup-stew. If it's too thick, add a cup of hot water.",nw:"Soured cream and fresh bread.",tags:["Freezes well"]},
 bolognese:{n:"Spaghetti bolognese",t:"beef",ic:"pasta",m:"Hob",time:"40 min",need:["mince","onion","carrot","celery","passata|jarsauce","pasta","mixedherbs"],
  ing:["800g beef mince","1 onion, 1 carrot and 2 celery sticks, finely chopped","1 tsp garlic powder (or 2 cloves)","700g passata, or 2 jars bolognese sauce","2 tbsp tomato purée, 1 tsp mixed herbs","Spaghetti, about 80g each, cooked fresh each night"],
  s:["Brown the mince in a big pan over a high heat, 5–6 min, breaking it up. Spoon off any fat.","Turn the heat down. Add the onion, carrot and celery and cook 5 min until soft.","Stir in the garlic, passata, purée and mixed herbs.","Simmer 25 min, lid half on, stirring now and then, until thick.","Each night, cook spaghetti 10 min. Save a splash of pasta water to loosen the sauce."],
  nw:"Grated cheddar on hers.",pw:"Torn mozzarella on P's.",tags:["Freezes well"]},
 leekcass:{n:"Chicken & leek casserole",t:"chicken",ic:"pot",m:"Slow cooker",time:"15 min + 6 h",need:["chthigh","leek","carrot","potato","stock","peas","tarragon"],
  ing:["1kg chicken thigh fillets","2 leeks, sliced and washed","3 carrots, in chunks","700g potatoes, in chunks","1 tbsp plain flour","500ml chicken stock","1 tsp dried tarragon","A handful of frozen peas"],
  s:["Toss the chicken in the flour.","Leeks, carrots and potatoes into the slow cooker first, chicken on top.","Pour over the stock and add the tarragon. Chicken, leek and tarragon is a classic mix.","Low 6 hours, until the potatoes are soft.","Stir in the peas for the last 10 min."],
  tip:"Wash leeks after slicing; grit hides between the layers.",nw:"Stir a spoon of soured cream or cream into her bowl."},
 papkrumpli:{n:"Paprikás krumpli (paprika potatoes & sausage)",t:"pork",ic:"pepper",m:"Hob",time:"40 min",need:["potato","sausage","onion","pepper","paprika","tomato|tomtins","marjoram"],
  ing:["1.2kg potatoes, in chunks","6 sausages (or a smoked sausage), sliced","2 onions, chopped","1 red pepper, diced","1 tomato, chopped","2 tbsp sweet paprika","1 tsp dried marjoram","About 600ml water or stock"],
  s:["Brown the sausage slices in a big pan, 5 min. Lift out.","Soften the onions in the same pan, 8 min.","Off the heat, stir in the paprika.","Add the potatoes, pepper, tomato, marjoram and enough water to just cover.","Simmer 25 min until the potatoes are soft. Squash a few against the side to thicken the sauce.","Stir the sausage back in."],
  nw:"Soured cream and a pickle on the side."},
 lasagne:{n:"Slow cooker lasagne",t:"beef",ic:"pasta",m:"Slow cooker",time:"25 min + 4 h",need:["mince","onion","lasauce|passata","lasagne","mozzarella"],
  ing:["800g beef mince","1 onion, chopped","2 jars red lasagne sauce (or 1 litre passata + 1 tsp mixed herbs)","10–12 lasagne sheets","2 balls mozzarella"],
  s:["Brown the mince with the onion, 8 min. Stir in the sauce.","Oil the slow cooker pot.","Layer: a ladle of sauce, sheets (snap to fit), sauce, sheets. Finish with sauce so no pasta is dry.","Low 4 hours. No longer, or the pasta goes soft.","Tear the mozzarella over for the last 30 min, lid on."],
  tip:"Leave it 10 min before cutting so it holds together.",nw:"Cheddar over her portion, then 3 min in the air fryer."},
 husleves:{n:"Húsleves (chicken soup)",t:"chicken",ic:"bowl",m:"Slow cooker",time:"15 min + 6 h",need:["chthigh","carrot","parsnip","celery","onion","orzo|pasta","bayleaf"],
  ing:["800g chicken thighs (bone-in gives the best broth)","4 carrots, 2 parsnips, 2 celery sticks, halved","1 onion, halved","2 chicken stock cubes, 1.5 litres water","A few peppercorns, 1 bay leaf, parsley","Orzo or small pasta, cooked separately"],
  s:["Everything except the pasta into the slow cooker.","Low 6–7 hours. Don't stir; a still pot keeps the broth clear.","Lift out the chicken, shred it, and take out any bones.","Slice the veg and put it back with the chicken.","Cook a little pasta each day and add it to the bowl, so it doesn't go mushy."],
  nw:"Already how she knows it. Nothing to change."},
 meatballs:{n:"Meatballs in tomato sauce",t:"beef",ic:"pasta",m:"Air fryer + hob",time:"35 min",need:["mince","eggs","passata|jarsauce","pasta","bread","mixedherbs"],

  tip:"Wet your hands to stop the mince sticking.",nw:"Cheddar on top of hers.",pw:"Mozzarella on P's.",tags:["Freezes well"]},
 ragu:{n:"Beef ragu with pasta",t:"beef",ic:"pasta",m:"Slow cooker",time:"15 min + 8 h",need:["beef","onion","carrot","jarsauce|passata","pasta","bayleaf"],
  ing:["800g diced beef","1 onion and 2 carrots, finely chopped","2 jars tomato & red wine sauce","1 bay leaf","Wholewheat pasta, cooked fresh"],
  s:["Everything except the pasta into the slow cooker.","Low 8 hours.","Shred the beef with two forks right in the pot. Take out the bay leaf.","Serve over pasta."],
  nw:"Cheddar or parmesan on top.",tags:["Freezes well"]},
 minceamash:{n:"Mince & mash (no-oven cottage pie)",t:"beef",ic:"pot",m:"Hob + air fryer",time:"45 min",need:["mince","onion","carrot","peas","potato","stock","puree","butter"],
  ing:["800g beef mince","1 onion and 2 carrots, diced","A handful of peas","2 tbsp tomato purée, 400ml beef stock, 1 tbsp cornflour","1.2kg potatoes, mashed with butter and a splash of milk"],

  nw:"Cheddar over her mash before it goes in."},
 cod:{n:"Breaded cod, wedges & peas",t:"fish",m:"Air fryer",time:"20 min",max:1,fresh:true,need:["cod","wedges","peas","lemon"],

 curry:{n:"Mild chicken & sweet potato curry",t:"chicken",ic:"rice",m:"Slow cooker",time:"15 min + 6 h",need:["chthigh","sweetpotato","onion","stock","rice"],

 bbqbowls:{n:"BBQ chicken & sweet potato bowls",t:"chicken",m:"Air fryer",time:"35 min",need:["chthigh|chbreast","bbq","sweetpotato","avocado"],
  ing:["700g chicken","2 tbsp BBQ seasoning, 1 tbsp oil","3 sweet potatoes, in 2cm cubes","1 tin sweetcorn","Avocado and tomato (add on the day)"],
  s:["Toss the sweet potato in oil and a pinch of salt. Air fry at 200°C for 18–20 min, shaking halfway.","Rub the chicken with the seasoning. Air fry at 200°C for 15–18 min.","Slice the chicken. Tub up with the sweet potato and sweetcorn.","Add sliced avocado when you eat it so it stays green."],

 porkolt:{n:"Sertéspörkölt (pork stew)",t:"pork",ic:"pot",m:"Slow cooker",time:"20 min + 7 h",need:["pork","onion","pepper","paprika","tomato","pasta|potato","marjoram"],

  s:["Soften the onions in a pan, 10 min, until really soft.","Off the heat, stir in the paprika and marjoram.","Into the slow cooker with everything else.","Low 7 hours. Lid off for the last 30 min if it's thin.","Serve with pasta (short shapes are closest to nokedli) or potatoes."],
  nw:"Soured cream and pickled cucumber.",tags:["Freezes well"]},
 orzochicken:{n:"Chicken, leek & pea orzo",t:"chicken",ic:"rice",m:"Hob",time:"30 min",need:["chthigh|chbreast","leek","peas","orzo","stock","lemon"],
  ing:["700g chicken, in bite-size pieces","2 leeks, sliced","400g orzo","1.2 litres chicken stock","2 big handfuls of frozen peas","Zest and juice of 1 lemon, parsley, black pepper"],
  s:["Brown the chicken in a little oil in a wide pan, 6 min. Lift out.","Soften the leeks in the same pan with a knob of butter, 5 min.","Stir in the orzo for 1 min, then add the stock and the chicken.","Simmer 12–14 min, stirring often like a risotto, until the orzo is tender and the stock is mostly absorbed.","Stir in the peas, lemon and pepper for the last 2 min."],
  tip:"Orzo thickens in the fridge. Loosen with a splash of water when reheating.",nw:"Stir in a spoon of cream and some cheddar.",pw:"No cheese needed; the lemon carries it."},
 friedrice:{n:"Chicken egg fried rice",t:"chicken",ic:"rice",m:"Hob",time:"25 min",max:2,need:["chbreast|chthigh","rice","eggs","peas","soy"],
  ing:["300g basmati rice","500g chicken, diced small","3 eggs, beaten","2 handfuls of frozen peas (or a sliced pepper and carrot)","3 tbsp soy sauce, 1 tsp garlic powder, 1 tsp ground ginger","Spring onions if you have them"],
  s:["Cook the rice 10 min, drain, spread on a tray and cool fast (cold rice fries best).","Fry the chicken in a hot pan, 6–7 min, until cooked through. Push to one side.","Scramble the eggs in the space, then mix in.","Add the peas and rice. Stir-fry 4–5 min on high.","Add the soy, garlic and ginger. Toss 1 min."],
  nw:"A drizzle of sweet chilli on hers, if she likes.",note:"Cool within an hour, fridge, and eat within 24 hours."},
 chcouscous:{n:"Chicken, roast veg & couscous",t:"chicken",ic:"rice",m:"Air fryer",time:"30 min",need:["chthigh|chbreast","couscous","courgette","pepper","onion","stock","cumin"],
  ing:["700g chicken, in chunks","2 tsp sweet paprika, 1 tsp ground cumin, 1 tsp garlic powder, 2 tbsp oil","2 courgettes, 2 peppers and 1 red onion, in chunks","250g couscous + 300ml hot chicken stock","Lemon juice, parsley"],
  s:["Toss the chicken and veg with the oil and spices.","Air fry at 200°C for 18–20 min in two batches, shaking halfway.","Pour the hot stock over the couscous, cover with a plate for 5 min, then fluff with a fork.","Mix everything with a squeeze of lemon. Tub up and fridge."],

 dillsalad:{n:"Dill potato salad with ham & eggs",t:"veg",ic:"leaf",m:"Hob",time:"25 min",max:2,need:["potato","eggs","ham","dill","cucumber","lemon"],

  tip:"Barely any cooking, which is why it lands on days when dinner is also being made. Dressing it while warm is the trick.",nw:"Stir a spoon of soured cream through hers, the Hungarian way."},
 rosechicken:{n:"Rosemary chicken & crispy potatoes",t:"chicken",ic:"drum",m:"Air fryer",time:"40 min",need:["chthigh","chickseason","rosemary","potato","broccoli|peas"],

  s:["Boil the potato chunks 6 min, drain and shake to rough up the edges.","Toss them in 1 tbsp oil, the rosemary, salt and pepper.","Rub the chicken with the chicken seasoning and the rest of the oil.","Air fry the potatoes at 200°C for 20 min, shaking halfway. Air fry the chicken at 200°C for 18–20 min in batches until no pink remains.","Fridge the rest. Each night: reheat chicken and potatoes at 190°C for 6–8 min. Microwave the veg."],
  tip:"Par-boiling the potatoes first is what makes them crisp.",nw:"Garlic mayo or soured cream to dip."},
 tarkony:{n:"Tárkonyos csirkeleves (chicken & tarragon soup)",t:"chicken",ic:"bowl",m:"Hob",time:"45 min",need:["chthigh|chbreast","carrot","parsnip","celery","onion","tarragon","stock","peas"],
  ing:["600g chicken, diced small","2 carrots and 1 parsnip, diced","2 celery sticks, sliced","1 onion, finely chopped","1½ tsp dried tarragon","1.5 litres chicken stock","A handful of frozen peas","1 tbsp flour + 1 tbsp oil (to thicken)","A squeeze of lemon"],

  tip:"Tarragon is what makes this one. Add it near the end so it stays fresh-tasting.",nw:"The classic version has soured cream stirred in. Add a spoon to hers.",tags:["Freezes well"]},
 falafel:{n:"Falafel wraps",t:"n",ic:"wrap",y:"2 portions",m:"Air fryer",time:"10 min",need:["falafel","wraps","cucumber","tomato"],

  tip:"Tzatziki and crumbled feta are good in these too."},
 leeksoup:{n:"Leek & potato soup",t:"veg",ic:"bowl",m:"Hob",time:"35 min",need:["leek","potato","onion","stock","butter"],

 fajitas:{n:"Chicken fajitas (mild)",t:"chicken",ic:"wrap",m:"Air fryer",time:"25 min",need:["chbreast","pepper","onion","wraps","cumin"],

 stirfry:{n:"Chicken stir fry with noodles",t:"chicken",ic:"pasta",m:"Hob",time:"20 min",need:["chbreast|chthigh","pepper","onion","carrot","celery","noodles","soy","honey"],

 carrotsoup:{n:"Carrot & sweet potato soup",t:"veg",ic:"bowl",m:"Hob",time:"35 min",need:["carrot","sweetpotato","onion","stock"],

 lecso:{n:"Lecsó with sausage",t:"pork",ic:"pepper",m:"Hob",time:"30 min",need:["pepper","onion","tomato|tomtins","sausage","paprika"],

 gyros:{n:"Chicken gyros wraps",t:"chicken",ic:"wrap",m:"Air fryer",time:"25 min",need:["chthigh","wraps","tomato","cucumber","lemon","mixedherbs"],
  ing:["1kg chicken thigh fillets","Marinade: 2 tbsp oil, juice of 1 lemon, 1 tsp each mixed herbs, paprika, garlic powder","Wraps or pittas","Tomato, cucumber, red onion","Frozen wedges (optional; in Greece the chips go inside the wrap)"],

 frittata:{n:"Ham & veg frittata",t:"veg",ic:"egg",m:"Hob + air fryer",time:"30 min",need:["eggs","ham","potato","pepper","peas"],
  ing:["10 eggs","110g ham, torn","2 potatoes, sliced thin","1 pepper, diced","A handful of frozen peas, chives"],
  s:["Boil the potato slices 8 min, drain.","Beat the eggs with salt and pepper. Stir in the ham, peas, pepper, chives and potato.","Pour into an oiled tin that fits your air fryer.","Air fry at 160°C for 18–22 min until set in the middle (do two if needed).","Cool, cut into wedges. Eat cold or warm with salad."],
  nw:"Cheddar over her half before it goes in."},
 tomsoup:{n:"Tomato & red pepper soup",t:"veg",ic:"bowl",m:"Hob",time:"35 min",need:["pepper","onion","carrot","tomtins|passata","stock","rolls|bread"],
  ing:["3 red peppers, chopped","1 onion and 2 carrots, chopped","2 tins chopped tomatoes","600ml veg stock","1 tsp sweet paprika, 1 tsp garlic powder","Crusty rolls or sourdough"],
  s:["Soften the onion, carrot and peppers, 10 min.","Add the tomatoes, stock, paprika and garlic. Simmer 20 min.","Blend smooth and season. A pinch of sugar takes the edge off.","Warm the rolls in the air fryer, 180°C for 3 min."],
  nw:"Swirl of soured cream, and a cheese-topped roll.",tags:["Freezes well"]},
 pestosalad:{n:"Pesto chicken pasta salad",t:"chicken",ic:"pasta",m:"Air fryer + hob",time:"25 min",need:["chbreast","pasta","pesto|redpesto|greenpesto","tomato","mozzarella"],
  ing:["600g chicken breast chunks","400g fusilli","1 jar aubergine pesto","200g cherry tomatoes, halved","1 ball mozzarella, torn","Half a cucumber, diced"],
  s:["Air fry the chicken at 200°C for 12–14 min, shaking halfway.","Cook the pasta, rinse in cold water and drain well.","Mix everything with the pesto.","Tub up. Eat cold, or warm for 2 min."],
  nw:"Cubes of cheddar or feta through hers."},
 salmonorzo:{n:"Salmon pesto orzo",t:"fish",ic:"fish",m:"Air fryer + hob",time:"20 min",max:2,need:["salmon","orzo","pesto|greenpesto|redpesto","courgette","lemon"],
  ing:["2–3 salmon fillets","300g orzo","3 tbsp aubergine pesto","1 courgette, diced","Cherry tomatoes, lemon"],
  s:["Air fry the salmon at 180°C for 10–12 min. Flake it and drop the skin.","Boil the orzo 9 min, adding the courgette for the last 3.","Drain. Stir in the pesto, tomatoes and a squeeze of lemon, then fold in the salmon.","Eat warm or cold."],
  nw:"A spoon of Greek yoghurt or crumbled feta.",note:"Keeps 2 days."},

 /* P's dishes: tomato and chicken, which N doesn't like */
 chpasta:{n:"Chicken & veg tomato pasta",t:"p",ic:"pasta",m:"Hob + air fryer",time:"30 min",need:["chbreast","courgette","pepper","jarsauce|passata","pasta","mozzarella"],
  ing:["450g chicken breast chunks","1 courgette and 1 pepper, diced","1 jar tomato & chargrilled veg sauce","250g penne or fusilli","1 ball mozzarella"],
  s:["Fry the chicken 8 min until browned.","Add the courgette and pepper, 5 min.","Pour in the sauce and simmer 10 min.","Stir in the cooked pasta.","To serve: into an air-fryer dish, torn mozzarella on top, 180°C for 6–8 min until bubbling."],
  pw:"Makes 3 portions. Fridge the rest for P's lunches."},
 cacciatore:{n:"Chicken cacciatore",t:"p",ic:"pot",m:"Slow cooker",time:"15 min + 6 h",need:["chthigh","pepper","onion","tomtins|passata","puree","mixedherbs"],
  ing:["500g chicken thigh fillets","1 pepper and 1 onion, sliced","1 tin chopped tomatoes","1 tbsp tomato purée","1 tsp mixed herbs, 1 tsp garlic powder, 1 bay leaf","Potatoes or pasta to serve"],
  s:["Everything into the slow cooker.","Low 6 hours.","Shred the chicken a little with a fork.","Serve with boiled potatoes or pasta."],
  pw:"Half batch: 3 portions. Freezes well."},
 parmigiana:{n:"Chicken parmigiana (mozzarella)",t:"p",ic:"cheese",m:"Air fryer",time:"25 min",need:["chbreast","passata|jarsauce","mozzarella","pasta|potato"],
  ing:["2 chicken breasts, flattened to 1.5cm","1 egg + 4 tbsp breadcrumbs (or crushed crackers)","4 tbsp passata with a pinch of mixed herbs","1 ball mozzarella, sliced","Pasta or wedges to serve"],
  s:["Dip the chicken in beaten egg, then breadcrumbs.","Air fry at 200°C for 12 min, turning once.","Spoon passata on top and lay the mozzarella over.","Back in for 4 min until melted and bubbling."],
  pw:"Makes 2. Have the second tomorrow."},

 /* N's favourites */
 csusza:{n:"Túrós csusza",t:"n",ic:"pasta",m:"Hob",time:"15 min",need:["pasta","cottage","soured","bacon|ham"],
  ing:["100g pasta per person (broken tagliatelle is traditional)","100g cottage cheese","2 tbsp soured cream","2 rashers bacon, or ham, chopped"],
  s:["Fry the bacon until crisp. Keep the fat in the pan.","Cook the pasta, drain, and toss it in the bacon fat.","Top with cottage cheese, soured cream and the bacon. Black pepper."]},
 lencse:{n:"Lencsefőzelék (Hungarian lentil stew)",t:"n",ic:"bean",m:"Hob",time:"35 min",y:"3–4 portions",need:["lentils","onion","stock","soured","sausage|eggs","bayleaf"],
  ing:["250g lentils (red cook fastest; brown hold their shape)","1 onion, finely chopped","1 bay leaf, 1 tsp sweet paprika","800ml stock","1 tbsp flour + 1 tbsp oil (for the roux)","1 tbsp vinegar or lemon juice","Soured cream; a fried egg or sliced sausage on top"],
  s:["Simmer the lentils with the bay leaf in the stock, 15–20 min until soft.","In a small pan, cook the onion in the oil 5 min. Stir in the flour for 1 min, then the paprika off the heat.","Whisk a ladle of the lentil liquid into the roux, then stir it all back into the lentils.","Simmer 5 min until thick. Add the vinegar and season.","Serve with soured cream, and a fried egg or sausage on top."],
  tip:"Freezes well in portions for her lunches."},
 babgulyas:{n:"Babgulyás (bean goulash)",t:"n",ic:"bowl",m:"Hob or slow cooker",time:"40 min",y:"4 portions",need:["beans","onion","carrot","pepper","paprika","stock","sausage","marjoram"],
  ing:["2 tins beans (kidney or borlotti), drained","1 smoked sausage, sliced","1 onion, chopped","2 carrots and 1 parsnip, diced","1 pepper, diced","1½ tbsp sweet paprika, 1 tsp dried marjoram, 1 tsp caraway (optional)","1 litre stock","Soured cream and bread to serve"],
  s:["Brown the sausage in a pot, lift out.","Soften the onion in the fat, 5 min. Off the heat, stir in the paprika, marjoram and caraway.","Add the carrots, parsnip, pepper and stock. Simmer 15 min.","Add the beans and sausage and simmer 10 min more.","Season, then top with soured cream."],
  tip:"Slow cooker: everything in, low 6 hours."},
 beanstew:{n:"Cheesy smoky bean & pepper stew",t:"n",ic:"bean",m:"Hob",time:"25 min",y:"3 portions",need:["beans","pepper","onion","tomtins","paprika","cheddar"],
  ing:["2 tins butter beans or mixed beans, drained","1 onion and 2 peppers, sliced","1 tin chopped tomatoes","2 tsp sweet paprika (smoked if you have it)","1 tsp garlic powder","Grated cheddar, soured cream, sourdough"],
  s:["Soften the onion and peppers, 8 min.","Stir in the paprika and garlic, then the tomatoes. Simmer 10 min.","Add the beans and warm through, 5 min. Squash a few to thicken.","Pile cheddar on top and let it melt (or 3 min in the air fryer)."],
  tip:"Great on toast for a fast lunch."},
 lentilsoup:{n:"Red lentil & carrot soup",t:"n",ic:"bowl",m:"Hob",time:"30 min",y:"4 portions",need:["lentils","carrot","onion","stock","yoghurt|soured","cumin"],
  ing:["200g red lentils, rinsed","3 carrots, grated","1 onion, chopped","1 tsp ground cumin, 1 tsp sweet paprika","1.2 litres stock","Lemon, a swirl of yoghurt or soured cream"],
  s:["Soften the onion 5 min. Add the spices for 30 seconds.","Add the lentils, carrots and stock.","Simmer 20 min until the lentils collapse.","Blend half for a creamy texture. Finish with lemon and a swirl of yoghurt."],
  tags:["Freezes well"]},
 chickpeasalad:{n:"Chickpea, feta & couscous salad",t:"n",ic:"leaf",m:"No cook",time:"15 min",y:"2–3 portions",need:["chickpeas","couscous","cucumber","tomato","stock"],
  ing:["1 tin chickpeas, drained","150g couscous + 180ml hot stock","Cucumber, tomatoes and pepper, diced","Feta (or cottage cheese), lemon, olive oil","Mint or parsley"],
  s:["Pour the hot stock over the couscous, cover 5 min, fluff with a fork.","Mix in the chickpeas and chopped veg.","Dress with lemon and olive oil, then crumble feta over."],
  tip:"Keeps 2 days. Add the feta on the day."},
 creampasta:{n:"Creamy chicken, ham & pea pasta",t:"n",ic:"pasta",m:"Hob",time:"20 min",need:["chbreast|chthigh","ham","peas","cream|soured","pasta"],
  ing:["1 chicken breast, sliced","2 slices ham, torn","A handful of frozen peas","100ml double cream (or soured cream)","Garlic, parsley","75g wholewheat pasta"],
  s:["Fry the chicken 6 min. Add the garlic, ham and peas for 2 min.","Pour in the cream and bubble 2 min.","Toss with the cooked pasta and parsley."]},
 broccbake:{n:"Cheesy chicken & broccoli pasta",t:"n",ic:"cheese",m:"Hob + air fryer",time:"25 min",need:["chbreast","broccoli","pasta","cheddar","milk","butter"],
  ing:["1 chicken breast, diced","A handful of broccoli","80g penne","Sauce: 15g butter, 1 tbsp flour, 200ml milk, 60g cheddar"],
  s:["Cook the pasta, adding the broccoli for the last 4 min. Fry the chicken 8 min.","Melt the butter, stir in the flour, and whisk in the milk until thick. Stir in the cheese.","Mix everything in an air-fryer dish with more cheese on top.","200°C for 8 min until golden."]},
 rakott:{n:"Rakott krumpli (layered potatoes)",t:"n",ic:"pot",m:"Hob + air fryer",time:"40 min",need:["potato","eggs","sausage","soured","butter"],
  ing:["3 medium potatoes","2 eggs","1 smoked sausage or 2 sausages, sliced","150ml soured cream","Butter"],
  s:["Boil the potatoes whole, 15–20 min. Hard-boil the eggs, 10 min. Slice both.","Butter an air-fryer dish. Layer potato, egg, sausage and a spoon of soured cream. Repeat, ending with potato and soured cream.","Air fry at 180°C for 15–20 min until golden."]},
 maccheese:{n:"Mac & cheese",t:"n",ic:"cheese",m:"Hob + air fryer",time:"20 min",need:["pasta","cheddar","milk","butter"],
  ing:["80g pasta","15g butter, 1 tbsp flour","200ml milk","70g cheddar, plus extra for the top"],
  s:["Cook the pasta.","Melt the butter, stir in the flour, and whisk in the milk until thick. Stir in the cheese.","Mix with the pasta. Optional: extra cheese on top, air fry at 200°C for 5 min."]},
 quesadilla:{n:"Cheesy chicken quesadilla",t:"n",ic:"wrap",m:"Air fryer",time:"10 min",need:["wraps","cheddar","chbreast|chthigh","soured"],
  ing:["2 wraps","60g cheddar, grated","A handful of cooked chicken (leftovers are perfect)","A few slices of pepper","Soured cream and avocado to dip"],
  s:["Scatter chicken, pepper and cheese over one wrap and put the other on top.","Air fry at 180°C for 6–8 min, turning once (a rack on top stops it flying about).","Cut into wedges and dip in soured cream."]},
 salmoncream:{n:"Creamy salmon & leek orzo",t:"n",ic:"fish",m:"Hob",time:"20 min",need:["salmon","leek","orzo","cream|soured"],
  ing:["1 salmon fillet","Half a leek, sliced","75g orzo","250ml stock","3 tbsp cream or soured cream","Lemon, dill"],
  s:["Soften the leek in butter, 5 min.","Add the orzo and stock and simmer 9 min, stirring.","Lay the salmon on top, lid on, 6–8 min (or air fry it).","Stir in the cream, flake the salmon through, and finish with lemon and dill."]},
 jacket:{n:"Loaded jacket potato",t:"n",ic:"cheese",m:"Air fryer",time:"45 min (hands-off)",need:["potato","cheddar","soured"],
  ing:["1 large potato","Grated cheddar","Soured cream and chives","Optional: ham, beans or leftover chicken"],
  s:["Prick the potato, rub with oil and salt.","Air fry at 200°C for 40–45 min, turning halfway.","Split, fill with cheddar and put back in for 3 min to melt.","Top with soured cream and chives."]},

 /* Breakfasts */
 usual:{n:"Crumpets, then avo toast",t:"bf",ic:"avo",m:"Toaster",time:"5 min",need:["crumpets","peanut","bread","avocado"],
  ing:["2 crumpets each with peanut butter","Later: sourdough, 1 ripe avocado, salt, black pepper, chilli-free seasoning or chives"],
  s:["Toast the crumpets twice on a medium setting so the middles cook through. Spread with peanut butter.","Later: toast the sourdough.","Halve the avocado, scoop it into a bowl and mash with a fork, leaving some chunks. Season with salt and pepper.","Pile onto the toast."],
  tip:"To ripen a hard avocado, keep it in a paper bag with a banana overnight.",nw:"Cheddar, tomato and cucumber on hers."},
 avoeggs:{n:"Avo & eggs on toast",t:"bf",ic:"egg",m:"Hob",time:"10 min",need:["bread","avocado","eggs"],
  ing:["Sourdough","1 avocado, salt and pepper","3–4 eggs"],
  s:["P, scrambled: whisk 2 eggs with a pinch of salt. Low heat with a little butter, stirring until just set.","N, poached: bring a pan of water to a gentle simmer. Swirl, crack the egg into the middle, 3 min. Lift out with a slotted spoon.","Toast the bread and spread with mashed avocado.","Eggs on top, black pepper over."],
  nw:"Poached for her, with cheddar, tomato and cucumber."},
 pbbanana:{n:"Peanut butter & banana toast",t:"bf",ic:"toast",m:"Toaster",time:"3 min",need:["bread","peanut","banana"],
  ing:["Sourdough","Peanut butter","1 banana, sliced","Optional: a drizzle of honey or a pinch of cinnamon"],

 pbcrumpets:{n:"Crumpets with peanut butter",t:"bf",ic:"toast",m:"Toaster",time:"5 min",need:["crumpets","peanut"],
  ing:["2 crumpets each","Peanut butter"],
  s:["Toast the crumpets twice on a medium setting so the middles cook through.","Spread with peanut butter while they're hot so it melts in."]},
 pbtoast:{n:"Peanut butter on toast",t:"bf",ic:"toast",m:"Toaster",time:"3 min",need:["bread","peanut"],
  ing:["Sourdough, 2 slices each","Peanut butter"],
  s:["Toast the sourdough.","Spread with peanut butter while it's warm so it melts a little."]},
 bagel:{n:"Ham & egg bagels",t:"bf",ic:"egg",m:"Hob",time:"8 min",need:["bagels","ham","eggs"],
  ing:["2 sesame bagels","Ham","2 eggs, fried or scrambled"],
  s:["Toast the bagels.","Fry the eggs in a little oil, 2–3 min, or scramble them.","Fill with ham and egg."],nw:"A slice of cheddar in hers."},
 yog:{n:"Greek yoghurt & fruit",t:"bf",ic:"apple",m:"No cook",time:"3 min",need:["yoghurt","kiwi|pear|tangerine|banana"],
  ing:["Greek yoghurt","Kiwi, banana, pear or tangerine","Honey, and oats or granola"],
  s:["Spoon yoghurt into bowls.","Top with chopped fruit, oats and a drizzle of honey."]},
 oats:{n:"Overnight oats with honey & cinnamon",t:"bf",ic:"porridge",m:"No cook",time:"5 min + overnight",need:["oats","oatmilk|milk","yoghurt","honey","cinnamon","banana|kiwi"],
  ing:["80g oats","200ml oat milk (or milk)","2 tbsp Greek yoghurt","2 tsp honey","½ tsp ground cinnamon","Banana or kiwi to top"],
  s:["Stir the oats, oat milk, yoghurt, honey and cinnamon in a jar or tub.","Lid on, fridge overnight.","Loosen with a splash more oat milk in the morning. Top with sliced fruit."],
  tip:"Make two jars at once. They keep 2 days in the fridge."},
 croissant:{n:"Air fryer croissants",t:"bf",ic:"toast",m:"Air fryer",time:"15 min",need:["croissants"],
  ing:["Frozen croissants","Peanut butter and jam, or ham"],
  s:["Air fry from frozen at 160°C for 12–15 min. Check at 10; they brown fast.","Rest 2 min, then split and fill."],nw:"Ham and cheese melted inside hers."},
 pancakes:{n:"Pancakes & fruit",t:"bf",ic:"toast",m:"Air fryer",time:"5 min",need:["pancakes","yoghurt|kiwi|pear|banana"],
  ing:["Blueberry pancakes (shop-bought, or the homemade ones under Baking)","Peanut butter, Greek yoghurt","Fruit"],
  s:["Warm the pancakes in the air fryer, 180°C for 2–3 min.","Top with peanut butter, yoghurt and fruit."]},
 lecsoeggs:{n:"Lecsó & eggs",t:"bf",ic:"pepper",m:"Hob",time:"25 min",need:["pepper","onion","tomato","eggs","bread"],
  ing:["2 peppers, 1 onion, 2 tomatoes","1 tsp sweet paprika","4 eggs","Sourdough"],
  s:["Soften the onion 5 min, then the peppers 8 min.","Off the heat, stir in the paprika. Add the tomato, 5 min.","Stir in beaten eggs until just set.","Serve with bread."]},
 plate:{n:"Hungarian breakfast plate",t:"bf",ic:"toast",m:"No cook",time:"10 min",need:["bread","ham","eggs","pepper","cucumber","tomato"],
  ing:["Sourdough or rolls","Ham","Boiled eggs","Pepper, tomato and cucumber, sliced"],
  s:["Boil the eggs 8 min, then cool in cold water.","Slice the veg.","Everyone builds their own."],nw:"Cheddar or cottage cheese on her plate."},
 bundas:{n:"Bundás kenyér (savoury eggy bread)",t:"bf",ic:"toast",m:"Hob",time:"10 min",need:["bread","eggs","milk"],
  ing:["4 slices sourdough","3 eggs, a splash of milk, salt","Tomato and cucumber to serve"],
  s:["Whisk the eggs, milk and salt in a shallow dish.","Soak the bread on both sides.","Fry in a little oil, 2–3 min a side, until golden."],nw:"Grated cheese over hers while it's hot."},
 rantotta:{n:"Rántotta (scrambled eggs with peppers)",t:"bf",ic:"egg",m:"Hob",time:"10 min",need:["eggs","onion","pepper","bread"],
  ing:["4 eggs","Half an onion and half a pepper, diced","A little oil, sourdough"],
  s:["Soften the onion and pepper in a little oil, 5 min.","Add the whisked eggs and stir gently until set.","Serve on toast."]},

 /* Baking */
 bananabread:{n:"Banana bread",t:"bake",m:"Oven or air fryer",time:"15 min + 1 h",y:"1 loaf",need:["banana","butter","sugar","eggs","raising","flour"],
  ing:["3 very ripe bananas","75g butter, melted","150g sugar (brown or white)","1 egg, beaten","1 tsp vanilla and ½ tsp cinnamon (both optional)","1 tsp bicarbonate of soda, a pinch of salt","190g plain flour","Optional: a handful of chocolate chips or walnuts"],
  s:["Heat the oven to 175°C (155°C fan). Line a 2lb loaf tin.","Mash the bananas in a big bowl. Stir in the melted butter.","Mix in the sugar, egg and vanilla, then the bicarb and salt.","Fold in the flour until just combined. A few lumps are fine.","Bake 50–60 min until a skewer comes out clean. Cool in the tin 10 min."],
  note:"Air fryer: use a smaller tin that fits, 155°C for 35–45 min, with foil over the top after 20 min so it doesn't burn."},
 pbcookies:{n:"Banana, oat & peanut butter cookies",t:"bake",ic:"cookie",m:"Oven or air fryer",time:"25 min",y:"About 12",need:["banana","oats","peanut"],
  ing:["2 ripe bananas","160g oats","2 tbsp peanut butter","Optional: raisins, chocolate chips, a pinch of cinnamon"],
  s:["Heat the oven to 180°C (160°C fan), or the air fryer to 170°C.","Mash the bananas, stir in the peanut butter and oats. Rest 5 min.","Scoop 12 balls onto a lined tray and flatten them.","Oven 15 min, or air fryer 8–10 min in batches, until golden at the edges."],
  note:"No added sugar. They're soft and cakey, not crisp."},
 flapjacks:{n:"Flapjacks",t:"bake",ic:"cookie",m:"Oven or air fryer",time:"35 min",y:"12 squares",need:["oats","butter","sugar","syrup"],
  ing:["250g oats","125g butter","125g light brown sugar","3 tbsp golden syrup","Optional: swap 50g of the butter for peanut butter"],
  s:["Heat the oven to 180°C (160°C fan). Line a 20cm square tin.","Melt the butter, sugar and syrup in a pan. Stir in the oats.","Press firmly into the tin.","Bake 20–25 min until golden at the edges. Cut into 12 while warm, then cool in the tin."],
  note:"Air fryer: in a tin that fits, 160°C for 15–18 min."},
 rolls:{n:"Bread rolls",t:"bake",ic:"toast",m:"Oven or air fryer",time:"30 min + 1½ h rising",y:"8 rolls",need:["strongflour","yeast"],
  ing:["500g strong white bread flour","7g sachet dried yeast","1½ tsp salt, 1 tsp sugar","2 tbsp olive oil","About 320ml lukewarm water"],
  s:["Mix the flour, yeast, salt and sugar. Add the oil and water and bring together into a soft dough.","Knead 10 min until smooth and springy.","Cover and leave somewhere warm for 1 hour, until doubled.","Knock back, shape 8 rolls and put them on a lined tray. Cover and rise 30–40 min.","Oven 220°C (200°C fan) for 15–20 min, or air fryer 180°C for 10–12 min in batches. They sound hollow when tapped underneath."],
  note:"Freeze half. Reheat from frozen in the air fryer, 160°C for 5 min."},
 hotcakes:{n:"Fluffy pancakes",t:"bake",m:"Hob",time:"20 min",y:"About 10",need:["flour","raising","eggs","milk","butter"],
  ing:["200g plain flour","2 tsp baking powder, 1 tbsp sugar, a pinch of salt","1 egg","250ml milk","1 tbsp melted butter, plus a little for the pan"],
  s:["Whisk the dry ingredients in a bowl.","Whisk the egg, milk and butter, pour into the dry and mix until just combined.","Rest 5 min.","Medium pan, a small ladle per pancake. Flip when bubbles pop on top, 1–2 min a side."],
  note:"Serve with peanut butter and sliced banana."},
 palacsinta:{n:"Palacsinta (Hungarian crêpes)",t:"bake",m:"Hob",time:"35 min",y:"About 12",need:["flour","eggs","milk"],
  ing:["200g plain flour","2 eggs","250ml milk + 200ml sparkling water","A pinch of salt, 1 tbsp oil","Fillings: jam, chocolate spread, cocoa and sugar, cinnamon sugar, or peanut butter"],
  s:["Whisk the flour, eggs and milk until smooth, then whisk in the sparkling water, salt and oil.","Rest 15 min.","Hot non-stick pan, a thin film of batter, swirl. 1 min, flip, 30 sec.","Fill and roll up."],
  nw:"Túrós filling: cottage cheese with sugar and lemon zest."},
 pogacsa:{n:"Sajtos pogácsa (cheese scones)",t:"bake",ic:"cheese",m:"Oven or air fryer",time:"30 min + 50 min rising",y:"About 20",need:["flour","yeast","butter","soured","cheddar","milk","eggs"],
  ing:["300g plain flour, 1 tsp salt","7g sachet dried yeast, 1 tsp sugar","100ml warm milk","125g cold butter, cubed","100g soured cream","1 egg (yolk in the dough, white to brush)","100g cheddar, grated, plus extra for the tops"],
  s:["Stir the yeast and sugar into the warm milk. Leave 10 min until frothy.","Rub the butter into the flour and salt until like breadcrumbs.","Add the yeast milk, soured cream, yolk and half the cheese. Knead into a soft dough. Rest 30 min.","Roll 2cm thick, score a criss-cross on top, cut 4–5cm rounds. Brush with egg white, top with cheese. Rise 20 min.","Oven 200°C (180°C fan) for 18–20 min, or air fryer 170°C for 12–14 min in batches."],
  nw:"These are hers, cheesy all the way through."},
 csiga:{n:"Kakaós csiga (cocoa swirls)",t:"bake",m:"Oven or air fryer",time:"40 min + 1½ h rising",y:"12 swirls",need:["flour","yeast","sugar","milk","eggs","butter","cocoa"],
  ing:["500g plain or strong flour","7g sachet dried yeast","50g sugar, a pinch of salt","250ml warm milk","1 egg","60g butter, melted","Filling: 50g butter melted, 3 tbsp cocoa, 4 tbsp sugar"],
  s:["Mix the flour, yeast, sugar and salt. Add the milk, egg and melted butter. Knead 8–10 min into a soft dough.","Cover and rise 1 hour.","Roll out to about 40×30cm. Brush with butter, sprinkle cocoa and sugar.","Roll up from the long side, cut into 12, lay cut side up on a lined tray. Rise 30 min.","Oven 180°C (160°C fan) for 20–25 min, or air fryer 160°C for 12–15 min in batches."]}
};
